# Gitleaks configuration for Gravity Room.
#
# Extend the upstream rules and suppress only exact public constants or fixtures.
# Every exception is restricted to a specific rule and literal value. There are
# deliberately no path allowlists: every file remains scannable for unrelated
# credentials. The workflow must pass --config=/repo/.gitleaks.toml because the
# container working directory is not the mounted repository.
[extend]
useDefault = true

# Public IndexNow ownership proof. It grants no API access and is intentionally
# published from the site root. Only the exact value under the generic heuristic
# is ignored; a different key-like value in the same files still fails scanning.
[[allowlists]]
description = "Public IndexNow ownership key"
targetRules = ["generic-api-key"]
regexes = ['''a3f8e1c97b6d452e8f0a1b2c3d4e5f60''']

# localStorage key names, not stored values. Keep separate literal exceptions so
# no neighboring value or file receives an exemption.
[[allowlists]]
description = "Guest localStorage key name"
targetRules = ["generic-api-key"]
regexes = ['''gzclp_guest_v1''']

[[allowlists]]
description = "Guest migration localStorage marker name"
targetRules = ["generic-api-key"]
regexes = ['''gzclp_guest_migration_pending_v1''']

# Non-functional compact-JWT fixture used by Google verifier tests. Suppress the
# exact complete fixture for the jwt rule and its exact header/payload components
# for the generic heuristic. Every other token-shaped value remains scannable.
[[allowlists]]
description = "Fake compact JWT fixture"
targetRules = ["jwt"]
regexes = ['''eyJhbGciOiJSUzI1NiIsImtpZCI6InRlc3QifQ\.eyJzdWIiOiJ1c2VyMSJ9\.c2ln''']

[[allowlists]]
description = "Fake JWT header fixture"
targetRules = ["generic-api-key"]
regexes = ['''eyJhbGciOiJSUzI1NiIsImtpZCI6InRlc3QifQ''']

[[allowlists]]
description = "Fake JWT payload fixture"
targetRules = ["generic-api-key"]
regexes = ['''eyJzdWIiOiJ1c2VyMSJ9''']
