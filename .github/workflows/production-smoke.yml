name: Production route smoke

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: production-route-smoke
  cancel-in-progress: true

jobs:
  routes:
    name: Production routes
    # Deploy ships only main, so a run on another branch has nothing to smoke.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check promoted SPA deep links and action headers
        env:
          PRODUCTION_URL: https://gravityroom.app
        run: pnpm run security:production-routes
