name: CI frontend

on:
  # Deploy runs the web checks on every push to main, so this push run is for mobile.
  push:
    branches: [main]
    paths:
      - 'apps/frontend/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      web-only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A called workflow sees the caller's name in github.workflow, so the group names this file.
  group: ci-frontend-${{ inputs.web-only }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: CI frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm --filter web typecheck

      - name: Lint web
        run: pnpm --filter web lint

      - name: Test web
        run: pnpm --filter web test

      - name: Typecheck mobile
        if: ${{ !inputs.web-only }}
        run: pnpm --filter mobile typecheck

      - name: Lint mobile and verify architecture rules
        if: ${{ !inputs.web-only }}
        run: pnpm --filter mobile lint && pnpm run test:mobile:lint

      - name: Test mobile
        if: ${{ !inputs.web-only }}
        run: pnpm --filter mobile test

      - name: Verify mobile SQLite migrations
        if: ${{ !inputs.web-only }}
        run: pnpm run test:mobile:sqlite

      - name: Export Android production bundle
        if: ${{ !inputs.web-only }}
        env:
          EXPO_PUBLIC_API_URL: https://gravityroom.app
        run: pnpm --filter mobile exec expo export --platform android --output-dir "$RUNNER_TEMP/gravity-android"
