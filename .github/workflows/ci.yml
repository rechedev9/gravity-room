name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Web SPA — typecheck, lint, unit tests, and a same-origin production build.
  # The build bakes in VITE_API_URL="" so the static SPA issues relative /api
  # requests against the same-origin Vercel catch-all function. The web build
  # also runs a Playwright/Chromium prerender pass, so Chromium is installed
  # before the build.
  # ---------------------------------------------------------------------------
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web run typecheck

      - name: Lint
        run: pnpm --filter web run lint

      - name: Test
        run: pnpm --filter web run test

      - name: Install Playwright Chromium (needed for prerender)
        working-directory: apps/frontend/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (same-origin)
        run: pnpm --filter web run build
        env:
          VITE_API_URL: ''

  # ---------------------------------------------------------------------------
  # API — typecheck, lint, unit tests, and DB-backed auth/security tests. The
  # unit suite includes analytics golden-file parity; the separate e2e suite
  # exercises real Postgres constraints, token rotation, and locking behavior.
  # ---------------------------------------------------------------------------
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gravity_room_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/gravity_room_security_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployable API bundle
        run: pnpm run bundle:api:check

      - name: Typecheck
        run: pnpm --filter api run typecheck

      - name: Lint
        run: pnpm --filter api run lint

      - name: Test (includes analytics golden-file parity)
        run: pnpm --filter api run test

      - name: Test DB-backed auth and security flows
        run: pnpm --filter api run test:e2e

  # ---------------------------------------------------------------------------
  # Shared domain package — the single source of truth for the progression
  # engine and schemas consumed by web, mobile, and api.
  # ---------------------------------------------------------------------------
  domain:
    name: Domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck:domain

      - name: Test
        run: pnpm run test:domain

  # ---------------------------------------------------------------------------
  # Shared API client package — the typed fetch wrapper consumed by the clients.
  # ---------------------------------------------------------------------------
  api-client:
    name: API client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck:api-client

      - name: Lint
        run: pnpm run lint:api-client

      - name: Test
        run: pnpm run test:api-client

  # ---------------------------------------------------------------------------
  # Expo mobile client — typecheck and the Jest unit suite.
  # ---------------------------------------------------------------------------
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck:mobile

      - name: Test
        run: pnpm run test:mobile

  # ---------------------------------------------------------------------------
  # Repository policy and formatting — tests and enforces dependency direction
  # between runtime apps and shared packages, then checks repo-wide formatting.
  # Web prerender tooling remains outside the runtime-source boundary and may
  # consume database seed data.
  # ---------------------------------------------------------------------------
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test architecture policy
        run: pnpm run architecture:test

      - name: Enforce architecture policy
        run: pnpm run architecture:check

      - name: Format check
        run: pnpm run format:check

  # ---------------------------------------------------------------------------
  # Security/deployment config — asserts static headers, action-route referrer
  # overrides, and the cleanUrls-compatible SPA rewrite. These checks read only
  # vercel.json, so malformed deep-link routing fails before deployment.
  # ---------------------------------------------------------------------------
  security-headers:
    name: Security headers and deployment config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check security headers
        run: pnpm run security:headers

      - name: Check Vercel rewrites and action routes
        run: pnpm run security:deployment

      - name: Check immutable workflow inputs
        run: pnpm run security:ci-pins

  # ---------------------------------------------------------------------------
  # OpenAPI client drift — catches divergence between the live ElysiaJS OpenAPI
  # surface and the committed client at apps/frontend/web/src/lib/api/generated.ts.
  # No Postgres needed: the serverless entrypoint has no boot-time DDL, so
  # /swagger/json serves from route schemas alone (DATABASE_URL just has to be
  # set — it is only dialed on the first DB-touching request). The dev auth
  # routes must be enabled because the committed client includes them.
  # ---------------------------------------------------------------------------
  api-types-drift:
    name: OpenAPI client drift
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/unused_swagger_only
      JWT_SECRET: ci-drift-check-secret-not-a-real-secret-just-32-plus-chars
      SWAGGER_ENABLED: 'true'
      AUTH_DEV_ROUTE_ENABLED: 'true'
      AUTH_DEV_ROUTE_SECRET: e2e-dev-secret-not-for-prod
      PORT: '3001'
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate client and diff
        run: |
          set -euo pipefail
          pnpm --filter api run start &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/swagger/json > /dev/null 2>&1; then
              echo "Swagger up after ${i} attempts"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::/swagger/json did not come up within 60s"
              exit 1
            fi
            sleep 2
          done

          pnpm --filter web run api:types

          if ! git diff --exit-code apps/frontend/web/src/lib/api/generated.ts; then
            echo "::error::API client is out of sync. Run 'pnpm --filter web run api:types' with the API running and commit the regenerated apps/frontend/web/src/lib/api/generated.ts."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Full build dependency policy — high/critical advisories fail closed across
  # runtime, development, test, and release-tool dependencies. Exceptions must
  # be advisory-specific, justified, and time-bounded in the reviewed policy.
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: Full build dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test fail-closed audit parsing
        run: pnpm run security:dependencies:test

      - name: Enforce dependency advisory policy
        run: pnpm run security:dependencies

  # ---------------------------------------------------------------------------
  # Gitleaks secret scan — scans Git history, but only history relevant to the
  # event: all commits reachable from the pushed HEAD, or the PR base..head
  # range. Unrelated remote branches cannot poison the main security gate.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Gitleaks git mode reads the commit graph; full history is required
          # to detect secrets that were committed and later removed.
          fetch-depth: 0

      - name: Run Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="--log-opts=${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            LOG_OPTS="--log-opts=${PUSH_HEAD_SHA}"
          fi
          # --config is REQUIRED: gitleaks runs with the container CWD at `/`,
          # not the mounted `/repo`, so it cannot auto-discover the repo's
          # .gitleaks.toml. Without this, the project allowlist is ignored and
          # the scan re-flags long-lived false positives (the public IndexNow
          # key, fake-JWT test fixtures), failing every push to main.
          # v8.30.0, pinned to its immutable multi-platform image digest.
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git /repo \
            --config=/repo/.gitleaks.toml \
            $LOG_OPTS \
            --redact \
            --no-banner \
            --exit-code=1 \
            --report-format=sarif \
            --report-path=/repo/gitleaks.sarif

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@bce182f857edf1feab116e9795a3393d21977282 # v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ---------------------------------------------------------------------------
  # Web e2e smoke — tracker visual polish + core interaction gates. Uses the
  # Playwright config's webServer (API + SPA preview). Needs a throwaway
  # Postgres so guest/auth-seeded flows can write programs.
  # ---------------------------------------------------------------------------
  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gravity_room
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/gravity_room
      JWT_SECRET: ci-e2e-secret-not-a-real-secret-min-32-chars-long
      AUTH_DEV_ROUTE_ENABLED: 'true'
      AUTH_DEV_ROUTE_SECRET: e2e-dev-secret-not-for-prod
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations + seeds
        run: pnpm --filter api db:deploy

      - name: Install Playwright Chromium
        working-directory: apps/frontend/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e smoke
        working-directory: apps/frontend/web
        run: pnpm exec playwright test e2e/tracker-visual-polish.spec.ts e2e/tracker-interactions.spec.ts --reporter=github

  # ---------------------------------------------------------------------------
  # Aggregate gate. Branch protection requires a single status check named
  # "Validate"; this job reports it and succeeds only when every job above
  # passed (a failed dependency leaves it skipped, which does not satisfy the
  # required check). Keeps the required-checks list stable across CI changes.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs:
      [
        web,
        api,
        domain,
        api-client,
        mobile,
        format,
        security-headers,
        api-types-drift,
        dependency-audit,
        secret-scan,
        e2e-smoke,
      ]
    steps:
      - run: echo "All CI checks passed."
